# One Application per directory under apps/, named after the directory.
# Same template as the infra set; a separate set so the two trees can
# later differ (own ArgoCD project, other sync behaviour, another branch)
# without touching infra. See appset-infra.yaml for the retry reasoning.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Orphan rather than delete on removal; right for anything with a PVC.
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/fredrik/homeops.git
        revision: main
        directories:
          - path: apps/*
          # Same guard as the infra set: the root's name is reserved.
          - path: apps/bootstrap
            exclude: true
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        # Which tree the Application came from, for the UI's label filter
        # and kubectl -l. The name alone does not say.
        homeops.fandango.cloud/tree: apps
    spec:
      project: default
      source:
        repoURL: https://github.com/fredrik/homeops.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        # Only used for resources that carry no namespace. An app's
        # manifests must namespace themselves (and ship the Namespace);
        # a resource landing here fails loudly with "namespace not found".
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - ServerSideDiff=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
