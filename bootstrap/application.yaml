# The root Application, and the only hand-written one. It manages this
# directory: itself and the two ApplicationSets. Every other Application is
# generated by a set.
#
# It is hand-written on purpose. A generated Application dies with its
# ApplicationSet (Kubernetes garbage-collects by ownerReference), so the
# thing that recreates a set after a bad commit, a rename or a stray delete
# must not itself be generated. With this root alive, deleting a set is
# healed by the next sync: the set comes back and regenerates its
# Applications, which adopt their still-running resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fredrik/homeops.git
    targetRevision: main
    path: bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
