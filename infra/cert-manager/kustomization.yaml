# cert-manager, rendered from the jetstack Helm chart by kustomize's
# helmCharts field so this component is a directory like every other one.
# Only the operator lives here; issuers and certificates are in
# cert-manager-config, a separate directory, because they need both these
# CRDs and the Porkbun webhook to exist first.
#
# This directory owns the cert-manager namespace and ships its manifest.
# porkbun-webhook lives in the same namespace and ships none.
#
# No top-level namespace: it would rewrite the leader-election Roles and
# RoleBindings this chart places in kube-system on purpose. The chart
# namespaces every resource itself from the entry below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.3
    # ArgoCD's native Helm source named the release after the Application.
    # Resource names derive from it, so keeping it keeps every name.
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
