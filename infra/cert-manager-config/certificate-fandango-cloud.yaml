# One wildcard certificate for everything behind the Traefik gateway.
# Lives in the traefik namespace because the Gateway's certificateRefs
# can only point at Secrets in its own namespace. The apex is left out:
# fandango.cloud itself points elsewhere and is not ours to serve.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fandango-cloud
  namespace: traefik
spec:
  secretName: fandango-cloud-tls
  dnsNames:
    - "*.fandango.cloud"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
