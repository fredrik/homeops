# DNS-01 solver webhook for Porkbun. Wave 5 because the chart issues its own
# serving certificate through cert-manager and so needs the CRDs from wave 4.
# The chart, its values and the hand-made Secret it needs are documented in
# infra/porkbun-webhook/.
#
# Automated sync is off during the switch from chart source to directory
# source, so a wrong render shows as a diff in the UI instead of being
# applied. It comes back in the next commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: porkbun-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/fredrik/homeops.git
    targetRevision: main
    path: infra/porkbun-webhook
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
