# Traefik v3 as the Gateway API implementation. The chart and its values
# are in infra/traefik/.
#
# Automated sync is off during the switch from chart source to directory
# source, so a wrong render shows as a diff in the UI instead of being
# applied. It comes back in the next commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/fredrik/homeops.git
    targetRevision: main
    path: infra/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
