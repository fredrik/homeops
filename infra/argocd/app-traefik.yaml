# Traefik v3 as the Gateway API implementation. ArgoCD renders the Helm
# chart itself; values live here. The legacy Ingress provider is off on
# purpose so routes are always HTTPRoutes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.3.0
    helm:
      valuesObject:
        providers:
          kubernetesGateway:
            enabled: true
          kubernetesIngress:
            enabled: false
        gateway:
          listeners:
            web:
              # Chart default only admits HTTPRoutes from the traefik
              # namespace; we want every namespace to attach routes.
              namespacePolicy:
                from: All
        # Rendered as a TLSOption CRD named "default" in the traefik
        # namespace, which Traefik applies to every TLS router that does
        # not pick its own options. sniStrict refuses handshakes with no
        # SNI or an SNI no certificate covers, so a port scanner cannot
        # pull our certificate (and the hostnames on it) just by
        # connecting. No listener terminates TLS yet; this is set ahead
        # of time so it is in place when one does.
        tlsOptions:
          default:
            sniStrict: true
        service:
          annotations:
            # Pin the LoadBalancer IP so DNS for *.fandango.cloud stays stable.
            metallb.io/loadBalancerIPs: 10.9.8.60
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
