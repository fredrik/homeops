apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  # Serve plain HTTP and stop redirecting to HTTPS. TLS is terminated at
  # the Traefik Gateway (websecure listener, cert-manager wildcard cert),
  # so inside the cluster argocd-server only ever sees plain HTTP.
  server.insecure: "true"
