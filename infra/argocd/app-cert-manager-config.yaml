# Issuers and certificates. Separate Application from the operator so
# these are applied only after cert-manager's CRDs and the Porkbun
# webhook exist (same reason metallb's pool sits in a later wave).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/fredrik/homeops.git
    targetRevision: main
    path: infra/cert-manager-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
