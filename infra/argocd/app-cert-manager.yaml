# cert-manager. Only the operator lives here; issuers and certificates come
# in a later wave once the CRDs exist. The chart and its values are in
# infra/cert-manager/.
#
# Automated sync is off during the switch from chart source to directory
# source, so a wrong render shows as a diff in the UI instead of being
# applied. It comes back in the next commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/fredrik/homeops.git
    targetRevision: main
    path: infra/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
